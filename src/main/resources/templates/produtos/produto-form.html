<div xmlns:th="http://www.thymeleaf.org" th:fragment="content">
    <div class="d-flex align-items-center gap-3 mb-4">
        <a href="/produtos" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="fw-bold mb-0">
            <span th:text="${produto.id != null} ? 'Editar Produto' : 'Novo Produto'"></span>
        </h2>
    </div>

    <div class="card shadow-sm" style="max-width: 600px;">
        <div class="card-body p-4">
            <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label for="nome" class="form-label fw-medium">
                        <i class="bi bi-box-seam me-1"></i>Nome
                    </label>
                    <input type="text" id="nome" class="form-control"
                           th:field="*{nome}" required />
                </div>

                <div class="mb-3">
                    <label for="tipo" class="form-label fw-medium">Tipo</label>
                    <select id="tipo" class="form-select" th:field="*{tipo}" required
                            onchange="alternarCamposPizza(this)">
                        <option value="" disabled>Selecione o tipo</option>
                        <option value="PIZZA">Pizza</option>
                        <option value="LANCHE">Lanche</option>
                        <option value="BEBIDA">Bebida</option>
                        <option value="OPCIONAL">Opcional</option>
                    </select>
                </div>

                <div id="camposPizza" class="d-none">
                    <div class="mb-3">
                        <label for="tipoPizza" class="form-label fw-medium">Tipo de Pizza</label>
                        <input type="text" id="tipoPizza" class="form-control"
                               th:field="*{tipoPizza}" />
                    </div>
                    <div class="mb-3">
                        <label for="sabor" class="form-label fw-medium">Sabor</label>
                        <input type="text" id="sabor" class="form-control"
                               th:field="*{sabor}" />
                    </div>
                </div>

                <div class="mb-3">
                    <label for="preco" class="form-label fw-medium">Preço</label>
                    <input type="number" id="preco" class="form-control"
                           th:field="*{preco}" min="0" step="0.01" required />
                </div>

                <div class="form-check mb-4">
                    <input type="checkbox" id="ativo" class="form-check-input"
                           th:field="*{ativo}" />
                    <label for="ativo" class="form-check-label">Produto ativo</label>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>Salvar
                    </button>
                    <a href="/produtos" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
        <script>
            function alternarCamposPizza(select) {
                const campos = document.getElementById('camposPizza');
                const pizza = select.value === 'PIZZA';
                campos.classList.toggle('d-none', !pizza);
                campos.querySelectorAll('input').forEach(function (input) {
                    input.required = pizza;
                });
            }

            alternarCamposPizza(document.getElementById('tipo'));
        </script>
    </div>
</div>
