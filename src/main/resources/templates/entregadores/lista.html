<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <h2 class="mb-4"><i class="bi bi-bicycle me-2 text-primary"></i>Entregadores</h2>
    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/entregadores/salvar}" method="post" class="row g-3">
                <div class="col-md-4"><label class="form-label" for="nome">Nome</label>
                    <input id="nome" name="nome" class="form-control" required></div>
                <div class="col-md-4"><label class="form-label" for="telefone">Telefone</label>
                    <input id="telefone" name="telefone" class="form-control"></div>
                <div class="col-md-3 d-flex align-items-end">
                    <div class="form-check"><input id="disponivel" name="disponivel" type="checkbox"
                        class="form-check-input" checked><label for="disponivel" class="form-check-label">Disponível</label></div>
                </div>
                <div class="col-md-1 d-flex align-items-end"><button class="btn btn-primary" type="submit">Salvar</button></div>
            </form>
        </div>
    </div>
    <div class="alert alert-info" th:if="${#lists.isEmpty(entregadores)}">Nenhum entregador cadastrado.</div>
    <div class="card shadow-sm" th:if="${!#lists.isEmpty(entregadores)}">
        <table class="table table-hover mb-0">
            <thead class="table-dark"><tr><th>Nome</th><th>Telefone</th><th>Status</th><th></th></tr></thead>
            <tbody><tr th:each="entregador : ${entregadores}">
                <td th:text="${entregador.nome}"></td><td th:text="${entregador.telefone}"></td>
                <td th:text="${entregador.disponivel ? 'Disponível' : 'Indisponível'}"></td>
                <td><form th:action="@{/entregadores/deletar/{id}(id=${entregador.id})}" method="post">
                    <button class="btn btn-sm btn-outline-danger" type="submit">Excluir</button>
                </form></td>
            </tr></tbody>
        </table>
    </div>
</div>
</body>
</html>
